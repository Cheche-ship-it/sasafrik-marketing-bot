apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-media-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-media-bot
  template:
    metadata:
      labels:
        app: social-media-bot
    spec:
      containers:
      - name: social-media-pro
        image: nduhiu254/social-media-pro:v1.0.7
        imagePullPolicy: Always
        env:
        - name: EXECUTION_MODE
          value: "SCHEDULER"
        envFrom:
        - secretRef:
            name: social-media-env
      restartPolicy: Always
