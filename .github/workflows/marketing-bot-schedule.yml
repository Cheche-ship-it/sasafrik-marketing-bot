name: Marketing Bot (manual dispatch)

on:
  workflow_dispatch:
    inputs:
      forced_mode:
        description: 'Select manual execution mode (override)'
        required: true
        default: 'STANDARD_POST'
        type: choice
        options:
          - STANDARD_POST
          - REELS

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies (ffmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version # Double-check installation

    - name: Install Python Package Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Resolve Execution Mode
      id: mode-resolver
      run: |
        # For manual dispatch use the selected forced_mode
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "EXECUTION_MODE=${{ github.event.inputs.forced_mode }}" >> $GITHUB_ENV
        else
          echo "EXECUTION_MODE=STANDARD_POST" >> $GITHUB_ENV
        fi

    - name: Reveal resolved mode
      run: echo "Resolved EXECUTION_MODE=$EXECUTION_MODE"

    - name: Run the marketing bot
      run: python main.py
      env:
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        EXECUTION_MODE: ${{ env.EXECUTION_MODE }}
        PAUSE_TWITTER: 'true'

    - name: Commit and Push State Changes
      run: |
        git config --global user.name "SasAfrik Bot"
        git config --global user.email "bot@sasafrik.com"
        git add processed_topics.json processed_reels.json last_run_summary.json || true
        git commit -m "chore: update automation history state [skip ci]" || true
        git push || true