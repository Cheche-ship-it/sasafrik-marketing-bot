name: Marketing Bot - Standard Posts (scheduled)

on:
  schedule:
    # Trigger Standard Feed Image/Text Updates at 07:30 UTC (10:30 EAT) on weekdays
    - cron: '30 7 * * 1-5'

jobs:
  run-standard:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (ffmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version # Double-check installation

    - name: Install Python Package Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Standard Post job
      run: python main.py
      env:
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        EXECUTION_MODE: STANDARD_POST
        PAUSE_TWITTER: 'true'

    - name: Commit and Push State Changes
      run: |
        git config --global user.name "SasAfrik Bot"
        git config --global user.email "bot@sasafrik.com"
        git add processed_topics.json processed_reels.json last_run_summary.json || true
        git commit -m "chore: update automation history state [skip ci]" || true
        git push || true
